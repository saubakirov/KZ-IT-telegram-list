<!doctype html>
<html lang="{{ page.lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }}</title>
    <meta name="description" content="{{ page.description | escape }}">
    <link rel="canonical" href="{{ page.canonical_url }}">
    <link rel="alternate" hreflang="en" href="{{ site.url }}{{ site.baseurl }}/">
    <link rel="alternate" hreflang="ru" href="{{ site.url }}{{ site.baseurl }}/ru/">
    <link rel="alternate" hreflang="kk" href="{{ site.url }}{{ site.baseurl }}/kk/">
    <link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ site.baseurl }}/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:title" content="{{ page.title | escape }}">
    <meta property="og:description" content="{{ page.description | escape }}">
    <meta property="og:url" content="{{ page.canonical_url }}">
    <meta property="og:locale" content="{{ page.og_locale }}">
    {% for locale in page.og_locale_alternates %}<meta property="og:locale:alternate" content="{{ locale }}">
    {% endfor %}<meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/social-preview.png">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="640">
    <meta property="og:image:alt" content="{{ page.title | escape }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | escape }}">
    <meta name="twitter:description" content="{{ page.description | escape }}">
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/social-preview.png">
    <meta name="twitter:image:alt" content="{{ page.title | escape }}">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dataset",
        "name": {{ page.title | jsonify }},
        "description": {{ page.description | jsonify }},
        "url": {{ page.canonical_url | jsonify }},
        "inLanguage": {{ page.lang | jsonify }},
        "dateModified": {{ page.last_modified | jsonify }},
        "license": "https://creativecommons.org/publicdomain/zero/1.0/",
        "isAccessibleForFree": true,
        "spatialCoverage": {
          "@type": "Place",
          "name": "Kazakhstan"
        },
        "sameAs": "https://github.com/saubakirov/KZ-IT-telegram-list",
        "distribution": {
          "@type": "DataDownload",
          "contentUrl": "https://saubakirov.github.io/KZ-IT-telegram-list/data/communities.json",
          "encodingFormat": "application/json"
        }
      }
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/catalog.css' | relative_url }}">
  </head>
  <body>
    <main id="catalog" class="catalog">
      {{ content }}
    </main>
  </body>
</html>
